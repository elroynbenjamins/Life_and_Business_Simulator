name: Prepare and validate precise tutorial targets
on:
  push:
    branches: [tutorial/precise-targets]
permissions:
  contents: write
concurrency:
  group: tutorial-precise-implementation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply scoped source edits
        run: node scripts/apply-precise-tutorial-pass.cjs
      - name: Install dependencies
        run: corepack enable && yarn install --immutable
      - name: Validate the actual edited source
        run: yarn validate
      - name: Commit validated source to implementation branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/tabs/index.tsx app/tabs/education.tsx app/tabs/career.tsx app/tabs/_layout.tsx app/housing.tsx src/components/GameButton.tsx src/components/GameCard.tsx src/engine/tutorialEngine.ts src/engine/firstLifeJourney.ts
          git commit -m 'Wire validated tutorial anchors and direct Transport routes'
          git push origin HEAD:refs/heads/tutorial/precise-targets
          node - <<'NODE'
          const {execFileSync} = require('node:child_process');
          const base = '05682e20318c6eb670e10df1e29dfcda8f75b521';
          const paths = execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(p=>p&&!p.startsWith('.github/')&&!p.startsWith('scripts/'));
          console.log('VALIDATED_COMMIT='+execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim());
          console.log('PUBLISH_ENTRIES='+JSON.stringify(paths.map(path=>({path,mode:'100644',type:'blob',sha:execFileSync('git',['rev-parse',`HEAD:${path}`],{encoding:'utf8'}).trim()}))));
          NODE
