name: Temporary feature validation

on:
  push:
    branches:
      - feature/acquisitions-holding-companies

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: corepack prepare yarn@4.13.0 --activate
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test:ci
